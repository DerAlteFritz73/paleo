services:
  web:
    build:
      context: .
    image: paleo-prod:latest
    container_name: paleo-prod
    restart: unless-stopped
    ports:
      - 127.0.0.1:2226:80
    volumes:
      - paleo-access-logs:/var/log/paleo
      - goaccess-report:/usr/share/nginx/html/stats:ro
    depends_on:
      - mail
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  # Tableau de bord de fréquentation (GoAccess), lu directement depuis les
  # journaux d'accès nginx du service "web" (volume paleo-access-logs,
  # lecture seule). Aucune donnée personnelle n'est envoyée par e-mail ni à un tiers
  # : tout reste local. Le rapport HTML est écrit dans goaccess-report, servi
  # par nginx sur /stats/ (protégé par mot de passe, voir default.conf) ; le
  # port 7890 ne sert que le flux WebSocket de rafraîchissement en direct et
  # n'est exposé que sur 127.0.0.1.
  stats:
    image: allinurl/goaccess:latest
    container_name: paleo-stats
    restart: unless-stopped
    command: >
      /var/log/paleo/access.log
      -o /report/index.html
      --log-format=COMBINED
      --real-time-html
      --port=7890
      --addr=0.0.0.0
      --ignore-crawlers
    ports:
      - 127.0.0.1:2228:7890
    volumes:
      - paleo-access-logs:/var/log/paleo:ro
      - goaccess-report:/report
    depends_on:
      - web
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  # Seul point dynamique du site (par ailleurs entièrement statique) : reçoit
  # les commentaires du formulaire en bas de page et les envoie par e-mail.
  # Jamais exposé hors du réseau Docker interne — nginx (service "web") lui
  # fait un fastcgi_pass sur mail:9000.
  mail:
    build:
      context: ./feedback
    image: paleo-feedback:latest
    container_name: paleo-feedback
    restart: unless-stopped
    env_file:
      - .env.local
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

volumes:
  # Journaux d'accès nginx (chemin dédié /var/log/paleo, distinct de
  # /var/log/nginx dont access.log/error.log sont des liens symboliques vers
  # stdout/stderr dans l'image de base — les écraser via un volume aurait
  # figé ces liens plutôt que de vrais fichiers). Persistés à travers les
  # reconstructions du conteneur "web" (docker compose up -d --build,
  # déclenché à chaque déploiement) et lus par "stats" (GoAccess).
  paleo-access-logs:
  # Rapport HTML généré par GoAccess, partagé en lecture avec "web" (servi
  # sous /stats/) et en écriture avec "stats" (qui le régénère en continu).
  goaccess-report:
