server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html/preview;
    index index.html;

    # Seule route dynamique du site : envoi du formulaire de commentaires,
    # relayé vers le petit service PHP-FPM "mail" (voir docker-compose.yml).
    location = /api/feedback {
        limit_except POST { deny all; }
        fastcgi_pass mail:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/feedback/send.php;
        include fastcgi_params;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
