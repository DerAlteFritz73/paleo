server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html/preview;
    index index.html;

    # Journal d'accès en format standard, lu par le tableau de bord GoAccess
    # (service "stats" de docker-compose.yml) — voir /var/log/nginx (volume
    # partagé nginx-logs). Aucune donnée ne sort du serveur.
    access_log /var/log/nginx/access.log combined;

    # Seule route dynamique du site : envoi du formulaire de commentaires,
    # relayé vers le petit service PHP-FPM "mail" (voir docker-compose.yml).
    location = /api/feedback {
        limit_except POST { deny all; }
        fastcgi_pass mail:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/feedback/send.php;
        include fastcgi_params;
    }

    # Tableau de bord de fréquentation (GoAccess) — privé, protégé par mot
    # de passe. Le fichier est régénéré en continu par le service "stats"
    # dans le volume partagé goaccess-report (voir docker-compose.yml).
    location /stats/ {
        auth_basic "Statistiques (privé)";
        auth_basic_user_file /etc/nginx/.htpasswd-stats;
        alias /usr/share/nginx/html/stats/;
        try_files $uri $uri/ /stats/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
